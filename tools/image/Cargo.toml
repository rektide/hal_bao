[package]
name = "bao-image"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Pack and sign Zephyr images for the Baochip 1x baremetal slot"

[dependencies]
bao1x-api = "0.1.3"
clap = { version = "4.5.45", features = ["derive"] }
goblin = "0.10.0"
xous-semver = "0.1.6"
xous-tools = { git = "https://github.com/betrusted-io/xous-core.git", rev = "5d5bbbfa95c0dcef26fe1fe9b496b7f6f31d191b" }

[dev-dependencies]
tempfile = "3.20.0"

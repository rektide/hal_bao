[package]
name = "bao-uf2send"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Send canonical Baochip UF2 images to the boot1 serial REPL"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.45", features = ["derive"] }
crc32fast = "1.5.0"
serialport = "4.9.0"

[dev-dependencies]
tempfile = "3.20.0"

[package]
name = "bao-uf2send"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Send canonical Baochip UF2 images to the boot1 serial REPL"

[dependencies]
bao-boot1-protocol = { path = "../boot1-protocol", version = "0.1.0" }
clap = { version = "4.5.45", features = ["derive"] }
serialport = "4.9.0"
